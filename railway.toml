# Build note: Nixpacks' uv provider emits `pip install uv==$NIXPACKS_UV_VERSION`
# but no longer injects a default, producing `pip install uv==` (invalid) and a
# failed build. A repo-side `nixpacks.toml [variables]` does NOT reach the build
# env on Railway (verified), so the version is pinned via a Railway *service
# variable*: NIXPACKS_UV_VERSION=0.11.20 (set on service 6d86e7b9). Keep it set.
[build]
builder = "nixpacks"

# Nixpacks installs uv itself in /opt/venv, while uv manages the project and its
# dependencies in /app/.venv. Launch through uv so it validates the project
# environment instead of executing a venv path that can be absent at runtime.
[deploy]
startCommand = "/opt/venv/bin/uv run --frozen --no-dev python -m agentsim_mcp.server --http"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
